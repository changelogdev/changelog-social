name: Watch

# Every 30 minutes: checks the swarm for milestones and records, posts the safe
# ones, sends anything about a specific project to Telegram for approval, and
# acts on your ✅ / ❌ replies (including to the weekly thread).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-social
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load saved progress
        run: bash state.sh load
      - name: Check the swarm
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_HANDLE: ${{ vars.X_HANDLE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_APPROVER: ${{ secrets.TG_APPROVER }}
          CHANGELOG_SCHEDULE_ID: ${{ vars.CHANGELOG_SCHEDULE_ID }}
        run: python changelog_social.py watch
      - name: Save progress
        if: always()
        run: bash state.sh save
