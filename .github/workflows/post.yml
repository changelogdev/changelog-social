name: Post

# Run by hand after approving the draft in Telegram. Posts each issue only once.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (blank = newest draft)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: check and print, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: changelog-social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load saved progress
        run: bash state.sh load
      - name: Post the thread
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_HANDLE: ${{ vars.X_HANDLE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_APPROVER: ${{ secrets.TG_APPROVER }}
          ISSUE: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          if [ -n "$ISSUE" ]; then
            case "$ISSUE" in *[!0-9]*) echo "Issue must be a number"; exit 1;; esac
            args="$args --issue $ISSUE"
          fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python changelog_social.py post $args
      - name: Save progress
        if: always()
        run: bash state.sh save
